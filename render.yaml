# Конфигурация для Render — можно импортировать вместо ручной настройки.
# Секретные значения (sync: false) вводятся в панели Render.
services:
  - type: web
    name: edunity-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 4000
      - key: DB_SSL
        value: 1
      - key: CORS_STRICT
        value: 0
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_REGION
        value: auto
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
