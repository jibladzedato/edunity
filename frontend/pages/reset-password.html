<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ახალი პაროლი | EDUNITY</title>
    <link rel="stylesheet" href="../css/syle.css">
    <link rel="stylesheet" href="../css/editor.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Days+One&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-msg-page">
        <a href="../index.html" class="logo">EDUNITY</a>
        <h1>ახალი პაროლი</h1>

        <div class="auth-msg-form" id="form">
            <input type="password" id="pass1" placeholder="ახალი პაროლი" autocomplete="new-password">
            <input type="password" id="pass2" placeholder="გაიმეორე პაროლი" autocomplete="new-password">
            <button class="studio-btn primary" id="save-btn">შენახვა</button>
            <p class="auth-msg-note">მინიმუმ 8 სიმბოლო</p>
            <p class="field-error" id="error" hidden></p>
        </div>

        <div id="done" hidden>
            <div class="auth-msg-icon">✓</div>
            <p>პაროლი შეიცვალა. ახლა შეგიძლია შეხვიდე ახალი პაროლით.</p>
            <a class="studio-btn primary" href="login.html">შესვლა</a>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script>
        const token = new URLSearchParams(window.location.search).get('token');
        const btn = document.getElementById('save-btn');
        const errEl = document.getElementById('error');

        if (!token) {
            errEl.textContent = 'ბმული არასწორია — გადმოწერე წერილიდან თავიდან';
            errEl.hidden = false;
            btn.disabled = true;
        }

        async function submit() {
            const p1 = document.getElementById('pass1').value;
            const p2 = document.getElementById('pass2').value;

            if (p1.length < 8) {
                errEl.textContent = 'პაროლი უნდა იყოს მინიმუმ 8 სიმბოლო';
                errEl.hidden = false;
                return;
            }
            if (p1 !== p2) {
                errEl.textContent = 'პაროლები არ ემთხვევა';
                errEl.hidden = false;
                return;
            }

            btn.disabled = true;
            errEl.hidden = true;
            try {
                await EdunityAPI.resetPassword(token, p1);
                document.getElementById('form').hidden = true;
                document.getElementById('done').hidden = false;
            } catch (err) {
                errEl.textContent = err.message;
                errEl.hidden = false;
                btn.disabled = false;
            }
        }

        btn.addEventListener('click', submit);
        document.getElementById('pass2').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') submit();
        });
    </script>
</body>
</html>
