<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>პაროლის აღდგენა | EDUNITY</title>
    <link rel="stylesheet" href="../css/syle.css">
    <link rel="stylesheet" href="../css/editor.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Days+One&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-msg-page">
        <a href="../index.html" class="logo">EDUNITY</a>
        <h1>პაროლის აღდგენა</h1>
        <p>შეიყვანე ფოსტა, რომლითაც დარეგისტრირდი — გამოგიგზავნით ბმულს ახალი პაროლისთვის.</p>

        <div class="auth-msg-form" id="form">
            <input type="email" id="email" placeholder="ელ.ფოსტა" autocomplete="email">
            <button class="studio-btn primary" id="send-btn">ბმულის გამოგზავნა</button>
            <p class="field-error" id="error" hidden></p>
        </div>

        <div id="done" hidden>
            <div class="auth-msg-icon">✓</div>
            <p>თუ ასეთი ფოსტა დარეგისტრირებულია, წერილი უკვე გამოგზავნილია. შეამოწმე შემოსულები და სპამიც.</p>
            <a class="studio-btn" href="login.html">შესვლის გვერდი</a>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script>
        const btn = document.getElementById('send-btn');
        const errEl = document.getElementById('error');

        async function submit() {
            const email = document.getElementById('email').value.trim();
            if (!email) {
                errEl.textContent = 'შეიყვანე ელ.ფოსტა';
                errEl.hidden = false;
                return;
            }
            btn.disabled = true;
            errEl.hidden = true;
            try {
                await EdunityAPI.forgotPassword(email);
                document.getElementById('form').hidden = true;
                document.getElementById('done').hidden = false;
            } catch (err) {
                errEl.textContent = err.message;
                errEl.hidden = false;
                btn.disabled = false;
            }
        }

        btn.addEventListener('click', submit);
        document.getElementById('email').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') submit();
        });
    </script>
</body>
</html>
