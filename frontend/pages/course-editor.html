<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>კურსის რედაქტორი | EDUNITY</title>
    <link rel="stylesheet" href="../css/syle.css">
    <link rel="stylesheet" href="../css/editor.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Days+One&display=swap" rel="stylesheet">
</head>
<body>
    <div class="overlay" id="overlay"></div>

    <header>
        <div class="header-container">
            <div class="logo-burger-container">
                <a href="../index.html" class="logo">EDUNITY</a>
                <img src="../assets/icon-menu.svg" class="burger" id="burger-button">
            </div>
            <nav id="nav">
                <button class="close" id="close-button"><img src="../assets/icon-close.svg" class="close-image"></button>
                <ul>
                    <li><a href="../index.html">მთავარი</a></li>
                    <li><a href="courses.html">კურსები</a></li>
                    <li><a href="teaching.html" class="active">სწავლება</a></li>
                    <li class="nav-auth-item"><a href="login.html" class="auth-slot">კაბინეტი</a></li>
                </ul>
            </nav>
            <div class="desktop-auth">
                <a href="login.html" class="auth-slot">შესვლა/რეგისტრაცია</a>
            </div>
        </div>
    </header>

    <div class="editor-layout">
        <aside class="editor-sidebar">
            <div class="editor-course-title" id="editor-course-title">იტვირთება...</div>
            <span class="editor-status-badge" id="editor-status-badge"></span>

            <button class="editor-publish-btn" id="editor-publish-btn">გამოქვეყნება</button>

            <nav class="editor-nav">
                <button class="editor-nav-item active" data-section="description">აღწერა</button>
                <button class="editor-nav-item" data-section="content">შინაარსი</button>
                <button class="editor-nav-item" data-section="publish">პუბლიკაციის პარამეტრები</button>
                <button class="editor-nav-item" data-section="analytics">ანალიტიკა</button>
            </nav>

            <a href="teaching.html" class="editor-back">← ჩემი კურსები</a>
        </aside>

        <main class="editor-main" id="editor-main">
            <p class="editor-loading">იტვირთება...</p>
        </main>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/categories.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/publish-rules.js"></script>
    <script src="../js/upload.js"></script>
    <script src="../js/rich-text.js"></script>
    <script src="../js/course-editor.js"></script>
</body>
</html>
